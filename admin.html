<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel - Clinic</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <h2>Admin Panel</h2>
      <ul class="menu">
        <li class="active">All Appointments</li>
        <li onclick="logout()">Logout</li>
      </ul>
    </div>

    <div class="content">
      <h1>All Appointments</h1>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
