<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - Clinic</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg">
    <div class="auth-card">
      <h2>Register</h2>
      <p class="subtitle">Create your clinic account</p>

      <input class="input" id="name" type="text" placeholder="Full name" />
      <input class="input" id="email" type="email" placeholder="Email" />
      <input class="input" id="password" type="password" placeholder="Password (min 6)" />

      <button class="btn btn-primary" onclick="register()">Create Account</button>

      <div class="link">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="auth.js"></script>
</body>
</html>
